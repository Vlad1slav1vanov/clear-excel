name: Feature request
description: Suggest a focused improvement to clear-excel
title: "[Feature] "
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API or behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or alternative designs.

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: I considered effects on existing APIs and supported workbook formats.
          required: true
