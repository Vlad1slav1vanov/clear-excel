name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    if: github.repository == 'Vlad1slav1vanov/clear-excel'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Read package metadata
        id: package
        run: >-
          node -e "const fs = require('node:fs');
          const { name, version } = require('./package.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
          'name=' + name + '\nversion=' + version + '\n');"

      - name: Check npm registry
        id: registry
        run: |
          if pnpm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.package.outputs.version }} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: Publish with provenance
        if: steps.registry.outputs.published == 'false'
        run: pnpm publish --provenance --access public
